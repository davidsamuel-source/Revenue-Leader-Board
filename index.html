[data-theme=dark]{--bg:#0d1117;--c:#161b22;--t:#e6edf3;--m:#8b98a8;--b:#262e38;--p:#58a6ff}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 20px;background:var(--c);border-bottom:1px solid var(--b)}
header img,.lg{height:38px;background:#fff;padding:3px 6px;border-radius:6px}h1{font-size:17px;margin:0;flex:1}
select,input,button{font:inherit;padding:6px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}
nav{display:flex;gap:4px;padding:0 20px;background:var(--c);border-bottom:1px solid var(--b);overflow:auto}
nav a{padding:12px 14px;cursor:pointer;color:var(--m);border-bottom:2px solid transparent;white-space:nowrap}nav a.on{color:var(--p);border-color:var(--p)}
main{padding:20px;max-width:1400px;margin:auto}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px 16px;overflow:auto}
.k small{color:var(--m);text-transform:uppercase;font-size:11px}.k b{display:block;font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--m);text-transform:uppercase;padding:8px}td{padding:8px;border-top:1px solid var(--b)}
.G{color:var(--g)}.A{color:var(--a)}.R{color:var(--r)}
.bar{height:8px;background:var(--b);border-radius:9px;min-width:90px}.bar i{display:block;height:100%;border-radius:9px}.bar.G i{background:var(--g)}.bar.A i{background:var(--a)}.bar.R i{background:var(--r)}
.rk{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--b);font-size:12px}.r1{background:#f5c518}.r2{background:#b8c0cc}.r3{background:#cd7f32;color:#fff}
.q{background:linear-gradient(120deg,var(--p),#6a5acd);color:#fff;border-radius:14px;padding:22px;font-size:18px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.pill{padding:4px 12px;border-radius:99px;cursor:pointer;border:1px solid var(--b)}.pill.on{background:var(--p);color:#fff}
canvas{max-height:300px}
