<style>
:root{--bg:#f4f7fb;--c:#fff;--t:#1b2a44;--m:#5d6c86;--b:#e2e8f1;--p:#2b7cbf;--pd:#2f3e5b;--g:#16a34a;--a:#d97706;--r:#dc2626;--sh:0 1px 2px rgba(27,42,68,.04),0 8px 24px rgba(27,42,68,.06)}
[data-theme=dark]{--bg:#0b1220;--c:#131c2e;--t:#e8edf7;--m:#9aa9c2;--b:#243049;--pd:#8fc4ef;--p:#5aa9e6;--sh:0 1px 2px #0006,0 8px 24px #0005}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 24px;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
header img,.lg{height:38px;background:#fff;padding:3px 8px;border-radius:8px;border:1px solid var(--b)}
h1{font-size:17px;margin:0;flex:1;line-height:1.2}h1 small{display:block;font-size:11px;color:var(--m);font-weight:500}h2{margin:0}.sec{margin:26px 0 12px;font-size:16px}
select,input,button,textarea{font:inherit;padding:7px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 20%,transparent)}
button{cursor:pointer;transition:.15s}button:hover{border-color:var(--p)}button.p{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}
nav{display:flex;gap:6px;padding:12px 24px 0;overflow:auto}nav a{padding:8px 16px;border-radius:99px;cursor:pointer;color:var(--m);white-space:nowrap;font-weight:500;transition:.15s}nav a:hover{background:var(--b)}nav a.on{background:var(--p);color:#fff;box-shadow:var(--sh)}
main{padding:20px 24px 48px;max-width:1440px;margin:auto}main>*{animation:up .35s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}.g>*{min-width:0}.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px 18px;overflow:auto;box-shadow:var(--sh)}
.k{position:relative}.k:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--p)}
.k small{color:var(--m);text-transform:uppercase;font-size:11px;letter-spacing:.05em;font-weight:600}.k b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.02em}.k .sb{text-transform:none;letter-spacing:0;display:block;margin-top:2px;font-weight:400}
table{margin:0 auto;border-collapse:collapse}th{text-align:center;font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px;position:sticky;top:0;background:var(--c)}td{padding:10px 8px;border-top:1px solid var(--b);text-align:center}tr:hover td{background:rgba(100,116,139,.07)}
.G{color:var(--g)}.A{color:var(--a)}.R{color:var(--r)}
.bar{height:8px;background:var(--b);border-radius:9px;width:100%;min-width:90px;max-width:160px;margin:0 auto 3px}.bar i{display:block;height:100%;border-radius:9px}.bar.G i{background:var(--g)}.bar.A i{background:var(--a)}.bar.R i{background:var(--r)}
.rk{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--b);font-size:12px;font-weight:600}.r1{background:#f5c518;color:#000}.r2{background:#b8c0cc;color:#000}.r3{background:#cd7f32;color:#fff}
.tg{display:inline-block;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p);font-size:12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.pill{padding:4px 12px;border-radius:99px;cursor:pointer;border:1px solid var(--b)}.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.cv{position:relative;width:100%;height:300px}.usr{display:flex;align-items:center;color:var(--m);font-size:13px}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--b);font-size:14px;margin-right:8px;vertical-align:middle;flex:none}
.hero{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-bottom:16px}@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hl{display:flex;gap:16px;align-items:center}.hl .av{width:76px;height:76px;font-size:38px;margin:0}.mu{color:var(--m)}
.qb{background:linear-gradient(120deg,#2b7cbf,#6a5acd);color:#fff;border-radius:16px;padding:20px 24px;min-height:120px;display:flex;align-items:center;cursor:pointer;box-shadow:var(--sh)}.qa{animation:up .5s both}.qt{font-size:19px;font-weight:600;margin-bottom:6px}
.pb{height:14px;border-radius:99px;background:var(--b);overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.6s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,#2b7cbf,#22c55e);position:relative;overflow:hidden}.pb i:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,#fff6,transparent);animation:sh 2s infinite}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ms{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bg{padding:4px 12px;border-radius:99px;border:1px dashed var(--b);color:var(--m);filter:grayscale(1);opacity:.6}.bg.on{filter:none;opacity:1;border:1px solid var(--g);color:var(--g);animation:pop .6s}@keyframes pop{50%{transform:scale(1.15)}}
.cf{position:fixed;top:-30px;z-index:99;pointer-events:none;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.hm{text-align:center;font-variant-numeric:tabular-nums}.lgd{display:flex;gap:14px;flex-wrap:wrap;color:var(--m);font-size:12px;margin-bottom:10px}.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
details summary{cursor:pointer}.seg{display:inline-flex;gap:4px}
.gk{display:grid;gap:16px;margin-bottom:16px;grid-template-columns:repeat(var(--c,4),minmax(0,1fr))}.gk>*{min-width:0}.gk>:last-child{grid-column:span var(--sp,1)}@media(max-width:900px){.gk{grid-template-columns:repeat(2,minmax(0,1fr))}.gk>:last-child{grid-column:auto}}@media(max-width:480px){.gk{grid-template-columns:1fr}}
main.wide{max-width:1800px}.cv.tall{height:clamp(320px,52vh,600px)}

.kv{font-weight:600;white-space:nowrap}.kl{padding:14px 16px}.kl .kt{font-weight:600;margin-bottom:6px}.kl ol{list-style:none;margin:0;padding:0}.kl li{display:flex;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--b);font-size:13px;min-height:36px}.kl li:first-child{border-top:0}.kl li>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kl li.me{background:color-mix(in srgb,var(--p) 12%,transparent);border-radius:8px;font-weight:600}.kl li.gap{justify-content:center;color:var(--m);min-height:20px;padding:0}
tr.me td{background:color-mix(in srgb,var(--p) 10%,transparent)}
.pa-top{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) minmax(0,1.4fr);gap:16px;align-items:stretch;margin-bottom:16px}
.hl2{display:flex;gap:16px;align-items:center;justify-content:space-between}.hl2 .av{width:76px;height:76px;font-size:38px;margin:0}
.qb.qm{background:none;color:var(--m);padding:0;min-height:0;box-shadow:none;margin-top:10px;display:block;font-size:13px}.qb.qm .qt{font-size:13px;font-weight:500;margin:0;display:inline}.qb.qm small{display:inline;margin-left:6px}
.lbtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,240px) minmax(170px,240px);gap:16px;margin-bottom:16px}.lbtop.one{grid-template-columns:minmax(0,1fr) minmax(170px,240px)}.lbtop>.row{align-self:start;margin:0}
.g2b{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));margin-bottom:16px}.g2b>*{min-width:0}.g2b table{width:100%!important}
.lvl{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.l0{background:#e5e9f0;color:#475569}.l1{background:#dbeafe;color:#1d4ed8}.l2{background:#fef3c7;color:#b45309}.l3{background:#dcfce7;color:#15803d}.l4{background:linear-gradient(90deg,#f5c518,#f59e0b);color:#3b2a00}
.xp{height:6px;border-radius:9px;background:var(--b);overflow:hidden;margin-top:6px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#2b7cbf,#22c55e);border-radius:9px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}.rn-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,340px);gap:24px;align-items:center;margin-bottom:16px}.rn-hero .big{font-size:40px}
.pod3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;margin:12px 0 4px}.pod3 .pl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:opacity .6s,transform .6s}.pod3 .pl.hid{opacity:0;transform:translateY(24px)}.pod3 .pl .av{width:64px;height:64px;font-size:32px;margin:0}.pod3 .pl.p1 .av{width:80px;height:80px;font-size:40px}.pod3 .medal{font-size:30px}.pod3 .pl.me .pn{color:var(--p)}
.pod3 .stp{width:100%;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:40px;font-weight:800;color:#fff;height:0;overflow:hidden;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}.s1{background:linear-gradient(#f5c518,#d4a10a)}.s2{background:linear-gradient(#cbd2dc,#9aa5b4)}.s3{background:linear-gradient(#d9904a,#b06a28)}.pod3.go .s1{height:170px}.pod3.go .s2{height:120px}.pod3.go .s3{height:90px}
.lane{display:grid;grid-template-columns:30px minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px}.lane.me{background:color-mix(in srgb,var(--p) 12%,transparent)}.track{height:20px;background:var(--b);border-radius:99px}.track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#2b7cbf,#22c55e);transition:width 1.6s cubic-bezier(.2,.8,.2,1);position:relative}.track i em{position:absolute;right:-8px;top:-5px;font-style:normal;font-size:22px}
.awd{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-bottom:16px}.awd-c{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.awd-c.me{outline:2px solid var(--p)}.aw-e{font-size:36px;line-height:1}.aw-t{font-weight:700}.aw-w{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.awd-c.lock{opacity:.55}
.rn-t{width:100%!important}.rn-sec{margin:22px 0 10px;font-size:16px}

.st-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;flex-wrap:wrap}.st-brand{font-size:18px}.st-chips{display:flex;gap:6px;flex-wrap:wrap}

.wbx{margin-bottom:16px}

/* ---- v1.1 Scorecard workbook: Reachouts · WA % · M0 CONV · Calls KPI -> KPI rows ---- */
function scParse(wb){
 const nz=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' '),
  sh=names=>{const k=wb.SheetNames.find(s=>names.includes(nz(s)));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:null}):null},
  out={},put=(mo,key,m,v)=>{if(mo&&v!=null&&isFinite(v)){((out[mo]=out[mo]||{})[key]=out[mo][key]||{})[m]=v}},
  keyOf=r=>{const f=String(r[0]==null?'':r[0]).trim(),s=String(r[1]==null?'':r[1]).trim();return(f&&f.toLowerCase()!='not found'?f:s)+'|'+s},
  ym=y=>{const s=String(Math.round(+y));return/^\d{6}$/.test(s)?s.slice(0,4)+'-'+s.slice(4):null},
  sd=n=>{const d=XLSX.SSF.parse_date_code(+n);return d?d.y+'-'+String(d.m).padStart(2,'0'):null},
  hdrRow=R=>R.findIndex(r=>nz(r[0])=='extract pa names'),
  num=v=>typeof v=='number'&&isFinite(v)?v:(v==null||v===''?null:(isFinite(+v)?+v:null)),
  roll=(rows,dated,metric)=>{/* columns from index 3: dated[c]=month key; sums per PA per month; month kept only if its total > 0 */
   const tot={},acc={};rows.forEach(r=>{if(!String(r[1]||r[0]||'').trim())return;const k=keyOf(r);Object.keys(dated).forEach(c=>{const v=num(r[c]);if(v==null)return;const mo=dated[c];tot[mo]=(tot[mo]||0)+v;(acc[mo]=acc[mo]||{})[k]=(acc[mo][k]||0)+v})});
   Object.keys(acc).forEach(mo=>{if(tot[mo]>0)Object.keys(acc[mo]).forEach(k=>put(mo,k,metric,acc[mo][k]))})};
 let n=0;
 /* Reachouts: January..December, pre_webinar_attempt + post_webinar_attempt pairs from column D */
 const RO=sh(['reachouts']);if(RO){const h=hdrRow(RO);if(h>0){n++;const top=RO[h-1]||[],code=top.find(x=>/^\d{6}$/.test(String(Math.round(+x)))),y=code?Math.floor(+code/100):new Date().getFullYear(),pre={},post={};
  for(let c=3;c<(RO[h]||[]).length-1;c+=2){const mo=y+'-'+String((c-3)/2+1).padStart(2,'0'),a=nz(RO[h][c]),b=nz(RO[h][c+1]);if(a.startsWith('pre')&&b.startsWith('post')){pre[c]=mo;post[c+1]=mo}}
  roll(RO.slice(h+1),pre,'webinar_pre_count');roll(RO.slice(h+1),post,'webinar_post_count')}}
 /* WA %: one column per day, summed per month */
 const WA=sh(['wa %','wa%','wa']);if(WA){const h=hdrRow(WA);if(h>=0){n++;const d={};(WA[h]||[]).forEach((x,c)=>{if(c>=3&&typeof x=='number'&&x>30000)d[c]=sd(x)});roll(WA.slice(h+1),d,'webinar_attendance')}}
 /* M0 CONV: one column per month */
 const M0=sh(['m0 conv','m0 conversion','m0 conv.']);if(M0){const h=hdrRow(M0);if(h>=0){n++;const d={};(M0[h]||[]).forEach((x,c)=>{if(c>=3&&typeof x=='number'&&x>30000)d[c]=sd(x)});roll(M0.slice(h+1),d,'m0_conversion')}}
 /* Calls KPI: per month a pair of columns: SUM of Call_Duration (days fraction -> hours) and COUNTA of call_id (call attempts) */
 const CK=sh(['calls kpi','call kpi','calls kpi sheet']);if(CK){const mi=CK.findIndex(r=>r.some(x=>/^\d{6}$/.test(String(Math.round(+x)))&&+x>200000));
  if(mi>=0){n++;const hd=CK[mi+1]||[],dur={},cnt={};CK[mi].forEach((x,c)=>{if(x!=null&&/^\d{6}$/.test(String(Math.round(+x)))&&+x>200000){const mo=ym(x);if(/duration/i.test(hd[c]||''))dur[c]=mo;if(/call_id|count/i.test(hd[c+1]||''))cnt[c+1]=mo}});
   const roster={};[M0,WA,RO].forEach(S_=>{if(!S_)return;const h=hdrRow(S_);S_.slice(h+1).forEach(r=>{const f=nz(r[0]);if(f&&f!='not found'&&!roster[f])roster[f]=keyOf(r)})});
   const rows=CK.slice(mi+2).filter(r=>r[0]&&roster[nz(r[0])]).map(r=>[roster[nz(r[0])],'',...r.slice(1)]);
   const sub=(m,map,k,sc)=>{const tot={},acc={};rows.forEach(r=>Object.keys(map).forEach(c=>{const v=num(r[+c+1]);if(v==null)return;const mo=map[c];tot[mo]=(tot[mo]||0)+v;(acc[mo]=acc[mo]||{})[r[0]]=(acc[mo][r[0]]||0)+v}));Object.keys(acc).forEach(mo=>{if(tot[mo]>0)Object.keys(acc[mo]).forEach(kk=>put(mo,kk,m,acc[mo][kk]*sc))})};
