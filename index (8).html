<script>

const QUOTES=[["Always be closing.","Glengarry Glen Ross","🎬"],["Show me the money!","Jerry Maguire","🎬"],["Just keep swimming.","Finding Nemo","🎬"],["I'll be back.","The Terminator","🎬"],["May the Force be with you.","Star Wars","🎬"],["To infinity and beyond!","Toy Story","🎬"],["Your attitude, not your aptitude, will determine your altitude.","Zig Ziglar","💼"],["Don't find customers for your products, find products for your customers.","Seth Godin","💼"],["Success is the sum of small efforts, repeated day in and day out.","Robert Collier","💼"],["Every no gets you closer to a yes.","Sales wisdom","💼"],["Every call is a deal in the making.","Team IK","💼"]];

const ROLEV={pa:['me','lb','rnr'],pod:['mp','lb','rnr','daily','trend'],admin:Object.keys(VIEWS)};
const $=s=>document.querySelector(s),LS=localStorage,SS=sessionStorage,id=i=>document.getElementById(i);
const D=n=>{n=fx(n);const i=S.cur=='INR';return(n<0?'-':'')+(i?'₹':'$')+Math.abs(Math.round(n)).toLocaleString(i?'en-IN':'en-US')},X=n=>Math.round(fx(n)),P=x=>isFinite(x)?(x*100).toFixed(1)+'%':'—',C=x=>x>=1?'G':x>=.75?'A':'R',col=x=>x>=1?'#16a34a':x>=.75?'#d97706':'#dc2626';

/* NEW: a PA belongs to manager n if n is its pod manager (m) OR its sub-pod manager (s) */
const own=(p,n)=>p.m==n||(!!p.s&&p.s==n);
/* Manager Progress: if no PA carries the exact manager name (e.g. sheet says "Gagandeep", PA rows say "Gagan"), fall back to a case-insensitive prefix match */
const al=(a,b)=>{a=(a||'').trim().toLowerCase();b=(b||'').trim().toLowerCase();return a.length>=3&&b.length>=3&&(a.startsWith(b)||b.startsWith(a))},
 memOf=(pl,n)=>{const x=pl.filter(p=>own(p,n));return x.length?x:pl.filter(p=>al(p.m,n)||al(p.s,n))};
const pick=(n,arr)=>arr.includes(n)?n:(arr.find(x=>al(x,n))||n);
const allMgrs=l=>[...new Set(l.flatMap(p=>[p.m,p.s]).filter(Boolean))].sort();
let S={data:{months:{}},users:[],me:null,view:null,pt:'m',pv:null,ch:[],q:[],f:{m:'',t:''},tab:'full',pod:'',prof:{},qi:0,lm:0,rb:'a',cur:LS.cur||'USD',mgr:''};
const save=()=>{LS.rl=JSON.stringify({d:S.data,u:S.users,p:S.prof,dirty:1})};
const mv=v=>v=='mgr'||v=='pod'?'mp':v=='mtd'?'lb':v;
function ghRepo(){const c=JSON.parse(LS.gh||'null');if(c&&c.o&&c.r)return c;const h=location.hostname,r=location.pathname.split('/')[1];return h.endsWith('.github.io')&&r?{o:h.split('.')[0],r}:null}
async function jf(p){const g=ghRepo();if(g)try{const k='et_'+p,h={Accept:'application/vnd.github.raw+json'};if(LS[k]&&LS['c_'+p])h['If-None-Match']=LS[k];const r=await fetch(`https://api.github.com/repos/${g.o}/${g.r}/contents/${p}`+(g.b?'?ref='+g.b:''),{headers:h});if(r.status==304)return JSON.parse(LS['c_'+p]);if(r.ok){const t=await r.text(),j=JSON.parse(t);try{LS[k]=r.headers.get('ETag')||'';LS['c_'+p]=t}catch(e){}return j}}catch(e){}
 const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
async function load(){const[a,b,c]=await Promise.all(['data.json','users.json','profiles.json'].map(p=>jf(p).catch(()=>null)));if(a)S.data=a;if(b)S.users=b.users||[];if(c)S.prof=c;
 const l=JSON.parse(LS.rl||'null');if(l&&l.dirty){S.data=l.d;S.users=l.u;S.prof=l.p||S.prof}
 S.users.forEach(u=>{const vs=[...new Set(u.views.map(mv))].filter(v=>VIEWS[v]);if(!u.v2){u.v2=1;if(u.role!='pa'&&!vs.includes('mp')){const i=vs.indexOf('pod');vs.splice(i>=0?i+1:vs.length,0,'mp')}}if(!u.v3){u.v3=1;if(!vs.includes('rnr')){const x=Math.max(vs.indexOf('mp'),vs.indexOf('lb'));vs.splice(x<0?vs.length:x+1,0,'rnr')}}u.views=vs});
 const m=JSON.parse(LS.myp||'null');if(m)S.prof[m.k]=m.o}
const H=async(s,p)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function mkUser(o){const s=crypto.randomUUID().slice(0,8);return{email:o.email.toLowerCase(),salt:s,hash:await H(s,o.pw),role:o.role,name:o.name,scope:o.scope,views:o.views,v2:1,v3:1}}
function loginUI(){const first=!S.users.length;
 id('app').innerHTML=`<main style="max-width:380px;margin-top:8vh"><div class=card>${logoImg('lg')}<h2>${first?'Create admin account':'Sign in'}</h2><div class=row style="flex-direction:column;align-items:stretch"><input id=em placeholder=Email type=email><input id=pw placeholder=Password type=password><button class=p id=go>${first?'Create admin':'Sign in'}</button><small id=er class=R></small></div></div></main>`;
 id('go').onclick=async()=>{const em=id('em').value.trim().toLowerCase(),pw=id('pw').value,er=id('er');
  if(!em||pw.length<6)return er.textContent='Enter an email and a password of 6+ characters';
  if(first){S.users=[await mkUser({email:em,pw,role:'admin',name:'Admin',scope:'',views:ROLEV.admin})];save()}
  const u=S.users.find(x=>x.email==em);if(!u||u.hash!==await H(u.salt,pw))return er.textContent='Invalid email or password';
  SS.rlu=em;start(u)}}
const mk=()=>Object.keys(S.data.months).sort();
const qts=()=>cfg().qtrs||[],ml=k=>MN[+k.slice(5)-1].slice(0,3)+' '+k.slice(0,4);
function pOpts(){const k=mk(),u=a=>[...new Set(a)],q=x=>x.slice(0,4)+'-Q'+Math.ceil(+x.slice(5)/3),h=x=>x.slice(0,4)+'-H'+(+x.slice(5)<7?1:2);
 return{m:k.map(x=>[x,S.data.months[x].label]),q:qts().length?qts().map((x,i)=>[String(i),x.n||ml(x.s)+' – '+ml(x.e)]):u(k.map(q)).map(x=>[x,x.replace('-',' ')]),h:u(k.map(h)).map(x=>[x,x.replace('-',' ')]),y:u(k.map(x=>x.slice(0,4))).map(x=>[x,x])}}
function keysFor(){const v=S.pv;return mk().filter(x=>{const y=x.slice(0,4),m=+x.slice(5);return S.pt=='m'?x==v:S.pt=='q'?(qts().length?(!!qts()[+v]&&x>=qts()[+v].s&&x<=qts()[+v].e):y+'-Q'+Math.ceil(m/3)==v):S.pt=='h'?y+'-H'+(m<7?1:2)==v:y==v})}
function agg(){const ks=keysFor(),now=new Date(),cy=now.getFullYear()*12+now.getMonth(),pas={},mt={},daily=[];let days=0,el=0;
 ks.forEach(k=>{const m=S.data.months[k],y=+k.slice(0,4),mo=+k.slice(5),dim=new Date(y,mo,0).getDate(),ix=y*12+mo-1,e=ix<cy?dim:ix==cy?now.getDate():0;days+=dim;el+=e;
  m.pas.forEach(p=>{const o=pas[p.n]=pas[p.n]||{n:p.n,t:0,a:0,tt:0,w:[0,0,0,0]};o.t+=p.t;o.a+=p.a;o.tt+=p.t*e/dim;o.m=p.m;o.s=p.s||'';{const q=(m.pw||{})[p.n.toLowerCase()]||[];for(let i=0;i<4;i++)o.w[i]+=q[i]||0}});
  const mg={};m.pas.forEach(p=>mg[p.m]=(mg[p.m]||0)+p.t);Object.entries(m.mt||mg).forEach(([n,t])=>mt[n]=(mt[n]||0)+t);m.daily.forEach(d=>daily.push({...d}))});
 const pl=Object.values(pas).map(p=>({...p,p:p.t?p.a/p.t:0,d:p.t-p.a,pt:p.tt?p.a/p.tt:0})).sort((a,b)=>b.a-a.a),ma={};
 daily.forEach(d=>Object.entries(d.v).forEach(([n,v])=>ma[n]=(ma[n]||0)+v));if(!daily.length)pl.forEach(p=>ma[p.m]=(ma[p.m]||0)+p.a);
 /* NEW: sub-pod roll-up. Every manager that appears as a pod manager of a PA that has a sub-pod, and every sub-pod manager,
    is computed straight from the PAs they own (parent = own PAs + all sub-pod PAs, sub-pod manager = own sub-pod PAs). */
 const subPA=pl.filter(p=>p.s&&p.s!=p.m),hs=[...new Set(subPA.flatMap(p=>[p.m,p.s]))],subs=[...new Set(subPA.map(p=>p.s))];
 hs.forEach(n=>{const x=pl.filter(p=>own(p,n));mt[n]=x.reduce((s,p)=>s+p.t,0);ma[n]=x.reduce((s,p)=>s+p.a,0)});
 const mg=Object.keys(mt).map(n=>({n,t:mt[n],a:ma[n]||0,p:mt[n]?(ma[n]||0)/mt[n]:0,d:mt[n]-(ma[n]||0)})).sort((a,b)=>b.a-a.a);
 return{ks,pl,mg,hs,subs,daily,days,el,dim:ks.length==1?days:0,drr:ks.length==1?S.data.months[ks[0]].drr||0:0,T:pl.reduce((s,p)=>s+p.t,0),A:pl.reduce((s,p)=>s+p.a,0)}}
function scope(g){const s=S.me.scope;if(!s)return g;g.pl=g.pl.filter(p=>own(p,s));g.mg=g.mg.filter(m=>m.n==s);g.T=g.pl.reduce((a,p)=>a+p.t,0);g.A=g.pl.reduce((a,p)=>a+p.a,0);g.daily=g.daily.map(d=>({...d,t:d.v[s]||0,v:{[s]:d.v[s]||0}}));return g}
const mc=(i,c)=>S.q.push(()=>S.ch.push(new Chart(id(i),c)));

<div class=card><b>8. KPI data (CSV)</b> <small>(M0 conversion, webinar attendance, audits, incentives… feeds My Progress)</small><p><small id=ks>${kstat()}</small></p><div class=row><button onclick="kdl('m')">⬇ kpi_metrics.csv</button><button onclick="kdl('d')">⬇ kpi_data.csv (existing members)</button></div><div class=row><label>Upload kpi_metrics.csv <input type=file accept=.csv onchange="kupl('m',this.files[0]);this.value=''"></label><label>Upload kpi_data.csv <input type=file accept=.csv onchange="kupl('d',this.files[0]);this.value=''"></label><button onclick=kclr()>Reset to sample</button></div><small>kpi_data.csv: month (YYYY-MM), pa_name, metric, value, base (denominator for rate metrics, blank otherwise). kpi_metrics.csv: metric, label, type (rate | count | currency), better (high | low), screen. Reserved metrics: webinar_pre_count, webinar_post_count. Uploading a month replaces that month. Click Publish afterwards.</small></div><br>
<div class=card><b>3. Create / edit user</b> <small>(same email = edit; leave password blank to keep it)</small><div class=row style="margin-top:8px"><input id=u_e placeholder=Email><input id=u_p type=password placeholder=Password><select id=u_r onchange=roleSet()><option>pa<option>pod<option>admin</select><input id=u_n placeholder="PA name (as in sheet)"><input id=u_s placeholder="Pod manager (blank = all)"></div><div class=row>${Object.keys(VIEWS).map(v=>`<label><input type=checkbox class=vc value=${v} ${ROLEV.pa.includes(v)?'checked':''}> ${VIEWS[v]}</label>`).join('')}</div><button class=p onclick=addU()>Save user</button></div><br>
<div class="g g2"><div class=card><b>4. Bulk add users (CSV)</b><div class=row style="margin-top:8px"><button onclick=sampleCsv()>⬇ Download sample CSV</button><input type=file accept=.csv onchange="this.files[0].text().then(t=>id('bc').value=t)"></div><textarea id=bc rows=4 style="width:100%" placeholder="email,password,role,name,scope,views"></textarea><br><small>Columns: email, password (6+), role (pa/pod/admin), name (PA name), scope (pod manager, needed for pod), views (optional, separated by |: ${Object.keys(VIEWS).join(', ')}). Existing emails are updated.</small><br><br><button class=p onclick=bulk()>Import users</button></div><div class=card><b>5. Import PA profiles</b><p><small>Paste the codes PAs send you (one per line).</small></p><textarea id=pi rows=4 style="width:100%"></textarea><br><br><button class=p onclick=impProf()>Import profiles</button></div></div><br>
<div class=card><table><tr><th>Email<th>Role<th>Name<th>Pod scope<th>Can see<th>${S.users.map((u,i)=>`<tr><td>${E(u.email)}<td>${u.role}<td>${E(u.name)}<td>${E(u.scope)||'all'}<td>${u.views.map(v=>VIEWS[v]).join(', ')}<td><button onclick=editU(${i})>Edit</button> <button onclick=resetPw(${i})>Reset PW</button> <button onclick=delU(${i})>Delete</button>`).join('')}</table></div>`};
function saveCur(){const c=S.data.cfg=S.data.cfg||{};c.src=id('c_src').value;c.rate=+id('c_rate').value||90;save();shell();alert('Currency saved. Click Publish so every user gets it.')}
function addQ(){const a=id('q_s').value,b=id('q_e').value,n=id('q_n').value.trim();if(!a||!b||a>b)return alert('Pick a start month and an end month that is not before the start');const c=S.data.cfg=S.data.cfg||{};(c.qtrs=c.qtrs||[]).push({n,s:a,e:b});c.qtrs.sort((x,y)=>x.s<y.s?-1:1);save();shell();alert('Quarter added. Click Publish so every user gets it.')}
function delQ(i){S.data.cfg.qtrs.splice(i,1);save();shell()}
function roleSet(){const r=id('u_r').value;document.querySelectorAll('.vc').forEach(x=>x.checked=ROLEV[r].includes(x.value))}
function editU(i){const u=S.users[i];id('u_e').value=u.email;id('u_r').value=u.role;id('u_n').value=u.name||'';id('u_s').value=u.scope||'';id('u_p').value='';document.querySelectorAll('.vc').forEach(x=>x.checked=u.views.includes(x.value));id('u_e').scrollIntoView({behavior:'smooth',block:'center'})}
async function addU(){const g=i=>id(i).value.trim(),r=g('u_r'),em=g('u_e').toLowerCase(),pw=id('u_p').value,vs=[...document.querySelectorAll('.vc:checked')].map(x=>x.value),i=S.users.findIndex(u=>u.email==em);
 if(!em)return alert('Email is required');if((i<0&&pw.length<6)||(pw&&pw.length<6))return alert('Password must be 6+ characters');if(r=='pod'&&!g('u_s'))return alert('Pod users need a pod manager name');
 const f={role:r,name:g('u_n'),scope:g('u_s'),views:r=='admin'?ROLEV.admin:vs.length?vs:ROLEV[r]};
 S.users[i>=0?i:S.users.length]=i>=0&&!pw?{...S.users[i],...f}:await mkUser({email:em,pw,...f});save();shell()}
async function resetPw(i){const p=prompt('New password for '+S.users[i].email+' (6+ characters)');if(!p)return;if(p.length<6)return alert('Too short');const s=crypto.randomUUID().slice(0,8);S.users[i]={...S.users[i],salt:s,hash:await H(s,p)};save();alert('Password updated. Click Publish to make it live.')}
function delU(i){const u=S.users[i];if(u.email==S.me.email)return alert('You cannot delete yourself');if(confirm('Delete '+u.email+'?')){S.users.splice(i,1);save();shell()}}
function sampleCsv(){const t='email,password,role,name,scope,views\npa1@interviewkickstart.com,Welcome@123,pa,Sushila,,me|lb\npod1@interviewkickstart.com,Welcome@123,pod,,Devoo,mp|lb|rnr|daily|trend\nadmin2@interviewkickstart.com,Welcome@123,admin,Admin Two,,\n',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='sample_users.csv';a.click()}
async function bulk(){const rows=id('bc').value.trim().split(/\r?\n/).map(l=>l.split(',').map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r.some(Boolean));if(rows.length&&/^email$/i.test(rows[0][0]))rows.shift();let a=0,u=0;const bad=[];
 for(const [em,pw,role,name,scope,vw] of rows){const e=(em||'').toLowerCase(),r=(role||'pa').toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(e)||(pw||'').length<6||!['pa','pod','admin'].includes(r)||(r=='pod'&&!scope)){bad.push(em||'(blank)');continue}
  const vs=r=='admin'?ROLEV.admin:vw?[...new Set(vw.split('|').map(mv))].filter(v=>VIEWS[v]&&v!='admin'):ROLEV[r],x=await mkUser({email:e,pw,role:r,name:name||'',scope:scope||'',views:vs.length?vs:ROLEV[r]}),i=S.users.findIndex(y=>y.email==e);i>=0?(S.users[i]=x,u++):(S.users.push(x),a++)}
 save();shell();alert(`Added ${a}, updated ${u}`+(bad.length?`, skipped ${bad.length}: `+bad.join(', '):'')+'. Click Publish to make it live.')}
function impProf(){let n=0;id('pi').value.split(/\s+/).filter(Boolean).forEach(c=>{try{const x=JSON.parse(decodeURIComponent(escape(atob(c))));if(x.k&&x.o){S.prof[x.k]=x.o;n++}}catch(e){}});save();shell();alert(n+' profile(s) imported. Click Publish to make them live.')}
function parseWb(wb){const R=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[],dn=wb.SheetNames.find(n=>/daily/i.test(n)),dr=dn?R(dn):[],hd=dr[0]||[],cols=[],byM={},yr={},out={},mt={};
 for(let c=1;c<hd.length&&hd[c]&&!/net/i.test(hd[c]);c++)cols.push(c);
 dr.slice(1).forEach(r=>{if(typeof r[0]!='number'||r[0]<40000)return;const dt=new Date(Math.round((r[0]-25569)*864e5)),mo=dt.getUTCMonth(),k=dt.getUTCFullYear()+'-'+String(mo+1).padStart(2,'0');yr[mo]=dt.getUTCFullYear();(byM[k]=byM[k]||[]).push({d:dt.getUTCDate(),t:+r[cols[cols.length-1]+1]||0,v:Object.fromEntries(cols.map(c=>[String(hd[c]).trim(),+r[c]||0]))})});
 for(const r of R('Managerial Leaderboard').slice(2)){if(/total/i.test(r[1]))break;if(typeof r[1]=='string'&&typeof r[2]=='number')mt[r[1].trim()]=r[2]}
 const pwk={},rw=R(wb.SheetNames.find(n=>/^raw$/i.test(n.trim()))||''),rh=(rw[0]||[]).map(x=>String(x||'').trim().toLowerCase()),rd=rh.findIndex(x=>/^date of sale/.test(x)),rp=rh.findIndex(x=>/^pa name/.test(x)),rn=rh.findIndex(x=>x=='net revenue');
 if(rd>=0&&rp>=0&&rn>=0)rw.slice(1).forEach(r=>{if(!r[rp]||typeof r[rn]!='number'||typeof r[rd]!='number')return;const dt=new Date(Math.round((r[rd]-25569)*864e5)),k=dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0'),w=Math.min(3,Math.floor((dt.getUTCDate()-1)/7)),n_=String(r[rp]).trim().toLowerCase();pwk[k]=pwk[k]||{};(pwk[k][n_]=pwk[k][n_]||[0,0,0,0])[w]+=r[rn]});
 const ms=MN.map((m,i)=>[m,i,wb.SheetNames.find(s=>s.trim().toLowerCase()==m.toLowerCase())]).filter(x=>x[2]);
 ms.forEach(([m,i,n])=>{const rr=R(n),h=rr.findIndex(r=>String(r[0]||'').trim().toLowerCase()=='pa');if(h<0)return;const pas=[];
  /* NEW: sub-pod column = header containing "sub" (falls back to the 7th column, which the sheet already carried). "-", "NA", "None" etc. mean no sub-pod. */
  const sc=(rr[h]||[]).findIndex(x=>/sub/i.test(String(x||''))),si=sc>=0?sc:6;
  for(let j=h+1;j<rr.length&&rr[j][0];j++){const r=rr[j],sv=String(r[si]||'').trim();pas.push({n:String(r[0]).trim(),t:+r[1]||0,a:+r[2]||0,m:String(r[5]||'').trim(),s:/^(-|—|na|n\/a|none|nil|0)$/i.test(sv)?'':sv})}
  const y=yr[i]||new Date().getFullYear(),k=y+'-'+String(i+1).padStart(2,'0');out[k]={label:m+' '+y,pas,mt:ms.length==1&&Object.keys(mt).length?mt:null,daily:(byM[k]||[]).sort((a,b)=>a.d-b.d),pw:pwk[k]||{},drr:0}});
 return out}
async function upl(f){if(!f)return;let msg;try{const o=parseWb(XLSX.read(await f.arrayBuffer(),{type:'array'})),ks=Object.keys(o);if(!ks.length)throw Error('no month tab found (a tab named like “September” with a PA column)');
 ks.forEach(k=>{const old=S.data.months[k];o[k].drr=old?old.drr:0;S.data.months[k]=o[k]});save();msg='Loaded '+ks.map(k=>`${o[k].label} (${o[k].pas.length} PAs, ${o[k].daily.length} days)`).join(', ')+'. Now click Publish.'}catch(e){msg='Upload failed: '+e.message}
 shell();id('us').textContent=msg}
async function gh(path,obj){const c=ghRepo()||{},t=SS.tok;if(!t||!c.o||!c.r)throw Error('Add GitHub owner, repo and token first');const u=`https://api.github.com/repos/${c.o}/${c.r}/contents/${path}`,h={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},b=c.b||'main',content=btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
 const sha=async()=>{const r=await fetch(`${u}?ref=${b}&_=${Date.now()}`,{headers:h,cache:'no-store'});if(r.ok)return(await r.json()).sha;if(r.status==404)return undefined;throw Error('GitHub error '+r.status)};
 const put=s=>fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'Update '+path,branch:b,sha:s,content})});
 let r;for(let i=0;i<3;i++){r=await put(await sha());if(r.status!=409&&r.status!=422)break;await new Promise(x=>setTimeout(x,400))}
 if(!r.ok)throw Error('GitHub '+r.status+': '+(await r.json()).message)}
async function pub(){try{if(id('gho')){LS.gh=JSON.stringify({o:id('gho').value.trim(),r:id('ghr').value.trim(),b:id('ghb').value.trim()||'main'});SS.tok=id('ght').value.trim();S.data.api=id('gha').value.trim()}
 S.data.updated=new Date().toISOString();await gh('data.json',S.data);await gh('users.json',{users:S.users});if(Object.keys(S.prof).length)await gh('profiles.json',S.prof);LS.rl=JSON.stringify({d:S.data,u:S.users,p:S.prof,dirty:0});alert('Published. The site updates in about a minute.')}catch(e){alert(e.message)}}
function start(u){S.me=u;const v=u.views.filter(x=>VIEWS[x]);S.view=v[0];S.pt='m';S.pv=null;shell()}
function toggleTheme(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;LS.th=t;shell()}
function shell(){clearInterval(S.qt);const u=S.me,o=pOpts(),vs=u.views.filter(x=>VIEWS[x]),pv=o[S.pt]||[];if(!vs.includes(S.view))S.view=vs[0];if(!pv.some(x=>x[0]==S.pv))S.pv=pv.length?pv[pv.length-1][0]:null;
 id('app').innerHTML=`<header>${logoImg()}<h1>Revenue Leaderboard<small>Performance portal</small></h1><select onchange="S.pt=this.value;S.pv=null;shell()" ${S.view=='rnr'?'disabled title="RNR shows month, quarter and half-year together"':''}>${[['m','Month'],['q','Quarter'],['h','Half-year'],['y','Year']].map(([a,b])=>`<option value=${a} ${a==S.pt?'selected':''}>${b}`).join('')}</select><select onchange="S.pv=this.value;shell()" ${S.view=='rnr'?'disabled':''}>${pv.map(([a,b])=>`<option value="${a}" ${a==S.pv?'selected':''}>${b}`).join('')}</select><span class=seg>${['USD','INR'].map(c=>`<button class="${S.cur==c?'p':''}" onclick="S.cur='${c}';LS.cur='${c}';shell()">${c}</button>`).join('')}</span><button onclick="toggleTheme()" title="Theme">◐</button><span class=usr>${av(u.name)}${E(pf(u.name).dn||u.email)}</span><button onclick="SS.clear();location.reload()">Sign out</button></header><nav>${vs.map(x=>`<a class="${x==S.view?'on':''}" onclick="S.view='${x}';S.f={m:'',t:''};S.tab='full';shell()">${VIEWS[x]}</a>`).join('')}</nav><main id=v></main>`;
 S.ch.forEach(c=>c.destroy());S.ch=[];S.q=[];const cs=getComputedStyle(document.body);Chart.defaults.color=cs.getPropertyValue('--m');Chart.defaults.borderColor=cs.getPropertyValue('--b');Chart.defaults.maintainAspectRatio=false;const el=id('v');el.className=S.view=='daily'?'wide':'';
 if(S.view=='admin'){el.innerHTML=V.admin();fit();return}
 if(!S.pv){el.innerHTML='<div class=card>No data yet. An admin can upload the monthly Excel from the Admin tab.</div>';return}
 el.innerHTML=S.view=='trend'?V.trend():V[S.view](scope(agg()));S.q.forEach(f=>f());fit();
 if(S.view=='me'||S.view=='mp'){S.qi=new Date().getDate();qnext();S.qt=setInterval(qnext,7000);cu();setTimeout(()=>{const b=id('pbi');if(b)b.style.width=b.dataset.w+'%'},80);if(S.fx)burst()}}
(async()=>{if(LS.th)document.documentElement.dataset.theme=LS.th;await load();const u=SS.rlu&&S.users.find(x=>x.email==SS.rlu);u?start(u):loginUI()})();
</script></body></html>
