<style>

header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 24px;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--b)}
header img,.lg{height:38px;background:#fff;padding:3px 8px;border-radius:8px;border:1px solid var(--b)}
